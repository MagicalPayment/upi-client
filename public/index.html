<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Client — UPI Payment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card" id="app">
    <h1>Client Payment</h1>
    <p id="status" class="muted"></p>

    <!-- Amount input row -->
    <div id="amountRow" class="row">
      <input id="amountInput" type="number" placeholder="Enter amount" min="1" />
      <button id="primaryBtn" class="btn">Pay</button>
    </div>

    <!-- Live status block -->
    <div id="kvBlock" class="kv hidden">
      <div><strong>Amount:</strong> <span id="amountOut">—</span></div>
      <div><strong>Status:</strong> <span id="statusOut">—</span></div>
      <div><strong>Time left:</strong> <span id="timer">00:00</span></div>
      <div class="actions">
        <!-- Visible only while session is active -->
        <button id="cancelBtn" class="btn cancel hidden">Cancel</button>
      </div>
    </div>

    <!-- Server down message -->
    <div id="serverDown" class="hidden">server down — please check your server</div>
  </div>

  <!-- Socket.IO client (needed for Live Server testing) -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://magicalpayment.github.io/UPI/script.js"></script>
</body>
</html>
